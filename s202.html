<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASIO.X</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Math.js for robust scientific calculations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    
    <style>
        /* Custom scrollbar for the live dashboard */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
        
        /* Argon Glassmorphism utility */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn {
            transition: all 0.15s ease-in-out;
            user-select: none;
        }
        .btn:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-white font-sans flex items-center justify-center p-4">

    <div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- ================= CALCULATOR UI ================= -->
        <div class="glass rounded-3xl p-6 shadow-2xl md:col-span-2 flex flex-col">
            <div class="mb-4 flex justify-between items-end">
                <h1 class="text-2xl font-semibold tracking-wider text-indigo-300">ZETIAN<span class="text-sm font-italic text-gray-400">Scientific FX001</span></h1>
                <span class="text-xs text-gray-400">MATH.JS ENGINE</span>
            </div>

            <!-- Display Screen -->
            <div class="glass rounded-xl p-4 mb-6 shadow-inner text-right relative overflow-hidden">
                <div id="trace" class="text-indigo-300/60 text-sm h-5 mb-1 font-mono tracking-widest overflow-hidden"></div>
                <input type="text" id="display" class="w-full bg-transparent text-right text-4xl font-mono focus:outline-none placeholder-gray-600" placeholder="0" readonly>
            </div>

            <!-- Keypad -->
            <div class="grid grid-cols-5 gap-3 flex-grow">
                <!-- Row 1: Scientific -->
                <button onclick="appendValue('sin(')" class="btn glass rounded-lg py-3 text-sm text-indigo-200 hover:bg-white/10">sin</button>
                <button onclick="appendValue('cos(')" class="btn glass rounded-lg py-3 text-sm text-indigo-200 hover:bg-white/10">cos</button>
                <button onclick="appendValue('tan(')" class="btn glass rounded-lg py-3 text-sm text-indigo-200 hover:bg-white/10">tan</button>
                <button onclick="appendValue('pi')" class="btn glass rounded-lg py-3 text-sm text-indigo-200 hover:bg-white/10">π</button>
                <button onclick="appendValue('e')" class="btn glass rounded-lg py-3 text-sm text-indigo-200 hover:bg-white/10">e</button>

                <!-- Row 2: Scientific -->
                <button onclick="appendValue('log(')" class="btn glass rounded-lg py-3 text-sm text-indigo-200 hover:bg-white/10">log</button>
                <button onclick="appendValue('sqrt(')" class="btn glass rounded-lg py-3 text-sm text-indigo-200 hover:bg-white/10">√</button>
                <button onclick="appendValue('^')" class="btn glass rounded-lg py-3 text-sm text-indigo-200 hover:bg-white/10">x^y</button>
                <button onclick="appendValue('(')" class="btn glass rounded-lg py-3 text-sm text-indigo-200 hover:bg-white/10">(</button>
                <button onclick="appendValue(')')" class="btn glass rounded-lg py-3 text-sm text-indigo-200 hover:bg-white/10">)</button>

                <!-- Row 3: Numbers & Controls -->
                <button onclick="appendValue('7')" class="btn glass rounded-lg py-4 text-xl hover:bg-white/20">7</button>
                <button onclick="appendValue('8')" class="btn glass rounded-lg py-4 text-xl hover:bg-white/20">8</button>
                <button onclick="appendValue('9')" class="btn glass rounded-lg py-4 text-xl hover:bg-white/20">9</button>
                <button onclick="clearDisplay()" class="btn glass rounded-lg py-4 text-xl text-red-400 hover:bg-red-500/20 font-semibold">AC</button>
                <button onclick="deleteLast()" class="btn glass rounded-lg py-4 text-xl text-orange-400 hover:bg-orange-500/20 font-semibold">DEL</button>

                <!-- Row 4: Numbers & Operators -->
                <button onclick="appendValue('4')" class="btn glass rounded-lg py-4 text-xl hover:bg-white/20">4</button>
                <button onclick="appendValue('5')" class="btn glass rounded-lg py-4 text-xl hover:bg-white/20">5</button>
                <button onclick="appendValue('6')" class="btn glass rounded-lg py-4 text-xl hover:bg-white/20">6</button>
                <button onclick="appendValue('*')" class="btn glass rounded-lg py-4 text-2xl text-indigo-300 hover:bg-indigo-500/20">×</button>
                <button onclick="appendValue('/')" class="btn glass rounded-lg py-4 text-2xl text-indigo-300 hover:bg-indigo-500/20">÷</button>

                <!-- Row 5: Numbers & Operators -->
                <button onclick="appendValue('1')" class="btn glass rounded-lg py-4 text-xl hover:bg-white/20">1</button>
                <button onclick="appendValue('2')" class="btn glass rounded-lg py-4 text-xl hover:bg-white/20">2</button>
                <button onclick="appendValue('3')" class="btn glass rounded-lg py-4 text-xl hover:bg-white/20">3</button>
                <button onclick="appendValue('+')" class="btn glass rounded-lg py-4 text-2xl text-indigo-300 hover:bg-indigo-500/20">+</button>
                <button onclick="appendValue('-')" class="btn glass rounded-lg py-4 text-2xl text-indigo-300 hover:bg-indigo-500/20">−</button>

                <!-- Row 6: Bottom Row -->
                <button onclick="appendValue('0')" class="btn glass rounded-lg py-4 text-xl hover:bg-white/20">0</button>
                <button onclick="appendValue('.')" class="btn glass rounded-lg py-4 text-xl hover:bg-white/20 font-bold">.</button>
                <button onclick="appendValue('ANS')" class="btn glass rounded-lg py-4 text-sm text-indigo-300 hover:bg-indigo-500/20 font-semibold">ANS</button>
                <!-- Equals Button -->
                <button onclick="calculateResult()" class="btn bg-indigo-600 hover:bg-indigo-500 rounded-lg py-4 text-2xl font-bold col-span-2 shadow-[0_0_15px_rgba(79,70,229,0.5)]">=</button>
            </div>
        </div>

        <!-- ================= LIVE DASHBOARD ================= -->
        <div class="glass rounded-3xl p-6 shadow-2xl flex flex-col h-[600px] md:h-auto">
            <div class="mb-4 flex justify-between items-center border-b border-white/10 pb-3">
                <h2 class="text-xl font-semibold flex items-center">
                    <span class="w-2 h-2 rounded-full bg-green-400 mr-2 animate-pulse shadow-[0_0_8px_rgba(74,222,128,1)]"></span>
                    Live History
                </h2>
                <!-- CLEAR DASHBOARD BUTTON -->
                <button onclick="clearDashboardHistory()" class="text-xs bg-red-500/10 hover:bg-red-500/30 text-red-400 py-1.5 px-3 rounded-lg transition-all flex items-center gap-1.5 border border-red-500/20">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Clear All
                </button>
            </div>
            
            <div id="dashboard-list" class="flex-grow overflow-y-auto space-y-3 pr-2">
                <!-- Initial Loading State -->
                <div class="text-center text-gray-400 mt-10 text-sm flex flex-col items-center">
                    <svg class="animate-spin h-5 w-5 text-indigo-400 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    Connecting to Firebase...
                </div>
            </div>
        </div>

    </div>

    <!-- ================= CALCULATOR LOGIC & KEYBOARD ================= -->
    <script>
        const display = document.getElementById('display');
        const trace = document.getElementById('trace');
        let currentExpression = '';
        let lastAnswer = '0'; 

        function appendValue(val) {
            if(val === 'ANS') {
                currentExpression += lastAnswer;
            } else {
                currentExpression += val;
            }
            display.value = currentExpression;
        }

        function clearDisplay() {
            currentExpression = '';
            display.value = '';
            trace.innerText = '';
        }

        function deleteLast() {
            currentExpression = currentExpression.toString().slice(0, -1);
            display.value = currentExpression;
        }

        function calculateResult() {
            if (!currentExpression) return;
            
            try {
                const originalExpression = currentExpression;
                const result = math.evaluate(currentExpression);
                const formattedResult = math.format(result, { precision: 12 });
                
                lastAnswer = formattedResult.toString();
                trace.innerText = `${originalExpression} =`;
                
                if(window.saveToDashboard) {
                    window.saveToDashboard(originalExpression, lastAnswer);
                }

                currentExpression = lastAnswer;
                display.value = currentExpression;

            } catch (error) {
                display.value = 'Syntax Error';
                setTimeout(() => {
                    display.value = currentExpression;
                }, 1500);
            }
        }

        document.addEventListener('keydown', function(event) {
            const key = event.key;
            
            if (/[0-9\+\-\*\/\.\(\)\^\%]/.test(key)) {
                appendValue(key);
                event.preventDefault();
            } else if (key === 'Enter') {
                calculateResult();
                event.preventDefault();
            } else if (key === 'Backspace') {
                deleteLast();
                event.preventDefault();
            } else if (key === 'Escape') {
                clearDisplay();
                event.preventDefault();
            }
        });
    </script>

    <!-- ================= FIREBASE DATABASE INTEGRATION ================= -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
        // Added getDocs and writeBatch for the delete function
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy, limit, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDOO_fwcMgmlojA1cxmrE-6UFfiSASmQoo",
            authDomain: "s202-9ac06.firebaseapp.com",
            projectId: "s202-9ac06",
            storageBucket: "s202-9ac06.firebasestorage.app",
            messagingSenderId: "984492121318",
            appId: "1:984492121318:web:eeccc4392da787bdd4ef27",
            measurementId: "G-71GP6BKV44"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const historyCollection = collection(db, "calculations");

        // Save Function
        window.saveToDashboard = async function(expression, result) {
            try {
                await addDoc(historyCollection, {
                    expression: expression,
                    result: result,
                    timestamp: serverTimestamp()
                });
            } catch (e) {
                console.error("Error saving to Firebase: ", e);
            }
        };

        // NEW: Clear History Function
        window.clearDashboardHistory = async function() {
            // Confirm before deleting
            if (!confirm("Are you sure you want to clear your calculation history?")) return;
            
            try {
                // Get all documents in the collection
                const snapshot = await getDocs(historyCollection);
                
                // Use a batch write to delete them all at once efficiently
                const batch = writeBatch(db);
                snapshot.forEach((docSnap) => {
                    batch.delete(docSnap.ref);
                });
                
                await batch.commit();
                // We don't need to manually update the HTML here because onSnapshot handles it!
            } catch (e) {
                console.error("Error clearing history: ", e);
                alert("Failed to clear history. Check console for details.");
            }
        };

        // Real-time listener
        const q = query(historyCollection, orderBy("timestamp", "desc"), limit(20));
        
        onSnapshot(q, (snapshot) => {
            const dashboardElement = document.getElementById('dashboard-list');
            
            if (snapshot.empty) {
                dashboardElement.innerHTML = '<div class="text-center text-gray-400 mt-10 text-sm flex flex-col items-center"><svg class="w-10 h-10 text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>History is empty. Start calculating!</div>';
                return;
            }

            let html = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const timeString = data.timestamp 
                    ? data.timestamp.toDate().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
                    : 'Just now';

                html += `
                <div class="p-3 bg-white/5 rounded-lg border border-white/10 hover:bg-white/10 transition-all cursor-pointer group" 
                     onclick="
                        document.getElementById('display').value = '${data.expression}'; 
                        document.getElementById('trace').innerText = 'Restored from history';
                        currentExpression = '${data.expression}';
                     ">
                    <div class="text-xs text-indigo-300/70 mb-1 flex justify-between">
                        <span>${timeString}</span>
                        <span class="opacity-0 group-hover:opacity-100 transition-opacity">Click to load</span>
                    </div>
                    <div class="font-mono text-white text-sm break-words group-hover:text-indigo-200 transition-colors">
                        ${data.expression} = <span class="font-bold text-green-400 text-base ml-1">${data.result}</span>
                    </div>
                </div>`;
            });
            
            dashboardElement.innerHTML = html;
        });
    </script>
</body>
</html>
